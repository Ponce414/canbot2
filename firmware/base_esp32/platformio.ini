; platformio.ini — one codebase, three builds.
;
;   pio run -e bringup -t upload     text protocol over USB, for bench tests (start here)
;   pio run -e microros -t upload    ROS 2 topics through the micro-ROS agent
;   pio test -e native               unit tests of lib/canbot_core, run on your laptop
;
; The two firmware builds differ ONLY in which transport file is compiled
; (build_src_filter). Control code, pins and gains are shared, so behavior you tuned on the
; bench is exactly the behavior you get under ROS.

[platformio]
default_envs = bringup

; ---------------------------------------------------------------------------
; Shared ESP32-S3 settings. Not a real environment; the two firmware envs `extends` it.
; ---------------------------------------------------------------------------
[esp32s3]
; Pinned: an unpinned platform can silently move to a new Arduino core and change APIs
; under you. 6.x ships Arduino-ESP32 2.0.x, which micro-ROS for PlatformIO is tested on.
; motor_driver.cpp also compiles on core 3.x, if you ever switch platforms.
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Core 2.x compiles as C++11 by default; the code uses C++17 features (aggregate
; initialization of structs with default member values, among others).
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    ; Route Serial to the S3's NATIVE USB port (the one labeled "USB", which shows up on
    ; Linux as /dev/ttyACM*, vendor ID 303a), not the USB-UART bridge port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    madhephaestus/ESP32Encoder@^0.11.7

[env:bringup]
extends = esp32s3
build_src_filter = +<*> -<transport_microros.cpp>

[env:microros]
extends = esp32s3
board_microros_distro = jazzy
board_microros_transport = serial
; Pinned to a commit for reproducible builds. The first build compiles the whole micro-ROS
; client library from source (needs git, cmake and pip3, and takes several minutes);
; later builds reuse it. After changing the two board_microros_* settings above, run
;   pio run -e microros -t clean_microros
lib_deps =
    ${esp32s3.lib_deps}
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
build_src_filter = +<*> -<transport_text.cpp>

; ---------------------------------------------------------------------------
; Host-side unit tests. PlatformIO only links lib/ into tests (src/ is excluded), which is
; exactly why all the pure logic lives in lib/canbot_core.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
